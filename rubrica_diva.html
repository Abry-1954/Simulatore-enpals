<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>La mia rubrica — DIVA Mobile</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
    background: #0f172a;
    color: #e2e8f0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 0;
  }
  .app {
    width: 100%;
    max-width: 760px;
    min-height: 100vh;
    background: linear-gradient(155deg, rgb(46,16,101) 0%, rgb(76,29,149) 50%, rgb(124,58,237) 100%);
    display: flex;
    flex-direction: column;
  }

  /* ===== HEADER (identico al calendario) ===== */
  .rub-header { padding: 1.1rem 1rem 0.9rem; flex-shrink: 0; }
  .rub-header-top { display: flex; align-items: center; gap: 10px; margin-bottom: 4px; }
  .rub-back {
    width: 34px; height: 34px; border-radius: 10px;
    background: rgba(255,255,255,0.12); border: none; color: #fff;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; font-size: 16px; flex-shrink: 0;
  }
  .rub-back:active { background: rgba(255,255,255,0.2); }
  .rub-title { font-size: 18px; font-weight: 700; color: #fff; }
  .rub-subtitle { font-size: 12px; color: rgba(255,255,255,0.6); margin-left: 44px; }

  /* ===== RICERCA ===== */
  .rub-search-wrap { padding: 0 1rem 0.9rem; flex-shrink: 0; }
  .rub-search {
    width: 100%; padding: 11px 14px; border-radius: 12px;
    border: none; font-size: 14.5px; font-family: inherit;
    background: rgba(255,255,255,0.12); color: #fff;
  }
  .rub-search::placeholder { color: rgba(255,255,255,0.55); }
  .rub-search:focus { outline: none; background: rgba(255,255,255,0.18); }

  /* ===== LISTA CONTATTI ===== */
  .rub-body { flex: 1; background: #f7f5fb; border-radius: 22px 22px 0 0; padding: 1.1rem 1rem 6rem; overflow-y: auto; }
  .rub-empty { text-align: center; color: #8a8598; font-size: 13.5px; padding: 3rem 1rem; }
  .rub-empty i { display: block; font-size: 30px; margin-bottom: 10px; }
  .rub-letter { font-size: 12px; font-weight: 700; color: #a855f7; text-transform: uppercase; letter-spacing: 0.04em; margin: 1rem 0 0.5rem; }
  .rub-letter:first-child { margin-top: 0; }
  .rub-card {
    background: #fff; border-radius: 14px; padding: 0.9rem 1rem;
    margin-bottom: 8px; box-shadow: 0 1px 3px rgba(46,16,101,0.08);
  }
  .rub-card-top { display: flex; align-items: center; gap: 10px; }
  .rub-avatar {
    width: 40px; height: 40px; border-radius: 50%; flex-shrink: 0;
    background: linear-gradient(135deg, #fb923c, #f97316);
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-weight: 700; font-size: 19px;
  }
  .rub-info { flex: 1; min-width: 0; }
  .rub-nome { font-size: 14.5px; font-weight: 700; color: #2e2a3d; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .rub-pseudo { font-size: 12px; color: #a855f7; font-weight: 600; }
  .rub-edit-btn {
    width: 32px; height: 32px; border-radius: 9px; border: none;
    background: #f4f2f9; color: #6b6678; font-size: 13px;
    cursor: pointer; flex-shrink: 0;
  }
  .rub-actions { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
  .rub-action {
    flex: 1; min-width: 100px; display: flex; align-items: center; justify-content: center; gap: 6px;
    padding: 9px 10px; border-radius: 10px; text-decoration: none;
    font-size: 12.5px; font-weight: 700; border: 1.5px solid transparent;
    overflow: hidden; white-space: nowrap; text-overflow: ellipsis;
  }
  .rub-action.call { background: #f0fdf4; color: #166534; border-color: #bbf7d0; }
  .rub-action.mail { background: #eff6ff; color: #1e40af; border-color: #bfdbfe; }
  .rub-note { margin-top: 8px; font-size: 12px; color: #8a8598; background: #faf9fc; border-radius: 8px; padding: 7px 10px; }

  /* ===== PULSANTE AGGIUNGI ===== */
  .rub-fab {
    position: fixed; bottom: 24px; right: 50%; transform: translateX(380px);
    width: 56px; height: 56px; border-radius: 50%; border: none;
    background: linear-gradient(135deg, #fb923c, #ea580c); color: #fff;
    font-size: 26px; display: flex; align-items: center; justify-content: center;
    box-shadow: 0 8px 20px rgba(234,88,12,0.4); cursor: pointer; z-index: 50;
  }
  @media (max-width: 760px) { .rub-fab { right: 24px; transform: none; } }

  /* ===== MODALE (identico al calendario) ===== */
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(15,23,42,0.55);
    display: none; align-items: flex-end; justify-content: center; z-index: 100;
  }
  .modal-overlay.show { display: flex; }
  .modal-sheet {
    width: 100%; max-width: 460px; background: #fff;
    border-radius: 20px 20px 0 0; padding: 1.3rem 1.2rem calc(1.3rem + env(safe-area-inset-bottom));
    max-height: 86vh; overflow-y: auto;
  }
  .modal-handle { width: 36px; height: 4px; background: #e2dfe9; border-radius: 3px; margin: 0 auto 1rem; }
  .modal-title { font-size: 17px; font-weight: 700; color: #2e2a3d; margin-bottom: 1.1rem; }
  .field-group { margin-bottom: 1rem; }
  .field-label {
    font-size: 12px; font-weight: 700; color: #6b6678;
    text-transform: uppercase; letter-spacing: 0.03em; margin-bottom: 6px; display: block;
  }
  .field-input {
    width: 100%; padding: 11px 13px; border-radius: 11px;
    border: 1.5px solid #e7e4ee; font-size: 14.5px; color: #2e2a3d;
    background: #faf9fc; font-family: inherit;
  }
  .field-input:focus { outline: none; border-color: #fb923c; background: #fff; }
  .field-row { display: flex; gap: 10px; }
  .field-row .field-group { flex: 1; }
  .modal-actions { display: flex; gap: 10px; margin-top: 1.4rem; }
  .btn-secondary, .btn-primary {
    flex: 1; padding: 13px; border-radius: 12px; font-size: 14.5px;
    font-weight: 700; border: none; cursor: pointer;
  }
  .btn-secondary { background: #f1eff6; color: #6b6678; }
  .btn-secondary:active { background: #e7e4ee; }
  .btn-primary { background: linear-gradient(135deg, #fb923c, #f97316); color: #fff; }
  .btn-primary:active { opacity: 0.85; }
  .btn-delete {
    width: 100%; margin-top: 10px; padding: 11px; border-radius: 12px;
    border: 1.5px solid #fecaca; background: #fff; color: #dc2626;
    font-size: 13.5px; font-weight: 700; cursor: pointer;
  }
  .import-row {
    display: flex; align-items: flex-start; gap: 10px;
    padding: 9px 0; border-bottom: 1px solid #f1eff6;
  }
  .import-row:last-child { border-bottom: none; }
  .import-row input[type="checkbox"] { width: 18px; height: 18px; margin-top: 2px; flex-shrink: 0; }
  .import-row-nome { font-size: 14px; font-weight: 700; color: #2e2a3d; }
  .import-row-dett { font-size: 12px; color: #8a8598; margin-top: 2px; }

  /* ===== LOGIN (identico al calendario) ===== */
  .login-screen {
    position: fixed; inset: 0; z-index: 500;
    background: linear-gradient(135deg, #4c1d95, #3730a3);
    display: flex; align-items: center; justify-content: center; padding: 24px;
  }
  .login-box { background: #fff; border-radius: 20px; padding: 32px 26px; width: 100%; max-width: 340px; box-shadow: 0 20px 60px rgba(0,0,0,.35); }
  .login-title { font-size: 20px; font-weight: 800; color: #2e2a3d; text-align: center; margin-bottom: 4px; }
  .login-sub { font-size: 12.5px; color: #8a8598; text-align: center; margin-bottom: 22px; }
  .login-field { margin-bottom: 12px; }
  .login-field label { display:block; font-size: 11px; font-weight: 700; color: #6b6678; text-transform: uppercase; margin-bottom: 4px; }
  .login-field input { width: 100%; padding: 11px 12px; border-radius: 10px; border: 1.5px solid #e7e4ee; font-size: 14px; font-family: inherit; }
  .login-field input:focus { outline: none; border-color: #fb923c; }
  .login-btn { width: 100%; margin-top: 8px; padding: 12px; border-radius: 12px; border: none; background: linear-gradient(135deg, #fb923c, #ea580c); color: #fff; font-size: 14.5px; font-weight: 700; cursor: pointer; }
  .login-btn:disabled { opacity: .6; cursor: not-allowed; }
  .login-error { background: #fef2f2; border: 1px solid #fecaca; color: #b91c1c; font-size: 12.5px; font-weight: 600; padding: 8px 12px; border-radius: 8px; margin-bottom: 12px; display: none; }
  .login-hint { font-size: 10.5px; color: #b0abbe; text-align: center; margin-top: 16px; line-height: 1.5; }
</style>
</head>
<body>

<div class="login-screen" id="login-screen">
  <div class="login-box">
    <div class="login-title">📇 La mia rubrica</div>
    <div class="login-sub">Accedi con le tue credenziali DIVA</div>
    <div class="login-error" id="login-error"></div>
    <div class="login-field">
      <label>Utente</label>
      <input type="text" id="login-user" autocomplete="username" placeholder="nome utente" onkeydown="if(event.key==='Enter') document.getElementById('login-pass').focus()">
    </div>
    <div class="login-field">
      <label>Password</label>
      <input type="password" id="login-pass" autocomplete="current-password" placeholder="password" onkeydown="if(event.key==='Enter') eseguiLogin()">
    </div>
    <button class="login-btn" id="login-btn" onclick="eseguiLogin()">Accedi</button>
    <div class="login-hint">Stesso login usato per il wizard fatture DIVA.<br>I tuoi contatti sono visibili solo a te.</div>
  </div>
</div>

<div class="app" id="app-root" style="display:none;">

  <div class="rub-header">
    <div class="rub-header-top">
      <button class="rub-back" aria-label="Torna alla home" onclick="chiudiRubrica()">←</button>
      <span class="rub-title">La mia rubrica</span>
    </div>
    <div class="rub-subtitle" id="user-label"></div>
  </div>

  <div class="rub-search-wrap">
    <input type="text" class="rub-search" id="rub-search" placeholder="🔍 Cerca per cognome, nome o pseudonimo..." oninput="renderContatti()">
    <button onclick="document.getElementById('import-file').click()" style="width:100%;margin-top:8px;background:rgba(255,255,255,0.12);border:none;border-radius:12px;padding:9px 12px;font-size:12.5px;color:#fff;font-weight:600;cursor:pointer;">📥 Importa da vCard (.vcf) — Gmail, Outlook, Thunderbird, telefono</button>
    <input type="file" id="import-file" accept=".vcf,text/vcard" style="display:none" onchange="gestisciFileImportato(event)">
  </div>

  <div class="rub-body" id="rub-body"></div>

  <button class="rub-fab" onclick="apriModaleNuovo()">+</button>
</div>

<!-- ══ MODALE CONTATTO ══ -->
<div class="modal-overlay" id="modal-overlay">
  <div class="modal-sheet">
    <div class="modal-handle"></div>
    <div class="modal-title" id="modal-title">Nuovo contatto</div>

    <div class="field-row">
      <div class="field-group">
        <label class="field-label">Cognome *</label>
        <input type="text" class="field-input" id="f-cognome" placeholder="Es. Rossi">
      </div>
      <div class="field-group">
        <label class="field-label">Nome</label>
        <input type="text" class="field-input" id="f-nome" placeholder="Es. Mario">
      </div>
    </div>

    <div class="field-group">
      <label class="field-label">Pseudonimo</label>
      <input type="text" class="field-input" id="f-pseudonimo" placeholder="Facoltativo">
    </div>

    <div class="field-row">
      <div class="field-group">
        <label class="field-label">Telefono 1</label>
        <input type="tel" class="field-input" id="f-telefono1" placeholder="Es. 333 1234567">
      </div>
      <div class="field-group">
        <label class="field-label">Telefono 2</label>
        <input type="tel" class="field-input" id="f-telefono2" placeholder="Facoltativo">
      </div>
    </div>

    <div class="field-group">
      <label class="field-label">Email</label>
      <input type="email" class="field-input" id="f-email" placeholder="nome@esempio.it">
    </div>

    <div class="field-group">
      <label class="field-label">Note</label>
      <input type="text" class="field-input" id="f-note" placeholder="Facoltative">
    </div>

    <div class="modal-actions">
      <button class="btn-secondary" onclick="chiudiModale()">Annulla</button>
      <button class="btn-primary" id="btn-salva-contatto" onclick="salvaContatto()">Salva</button>
    </div>
    <button class="btn-delete" id="btn-elimina-contatto" style="display:none" onclick="eliminaContatto()">🗑 Elimina contatto</button>
  </div>
</div>

<!-- ══ MODALE ANTEPRIMA IMPORTAZIONE ══ -->
<div class="modal-overlay" id="modal-import">
  <div class="modal-sheet">
    <div class="modal-handle"></div>
    <div class="modal-title">Importa contatti</div>
    <div id="import-info" style="font-size:12.5px;color:#8a8598;margin-bottom:12px;"></div>
    <div id="import-list" style="max-height:50vh;overflow-y:auto;"></div>
    <div class="modal-actions">
      <button class="btn-secondary" onclick="chiudiModaleImport()">Annulla</button>
      <button class="btn-primary" id="btn-conferma-import" onclick="confermaImportazione()">Importa selezionati</button>
    </div>
  </div>
</div>

<script>
// ════════════════════════════════════════════════════════════
// CONFIGURAZIONE API — stesso backend del calendario/wizard
// ════════════════════════════════════════════════════════════
const API_BASE = 'https://enpals-server.onrender.com';
let AUTH = { token: null, nominativo: null, ruolo: null };
let contatti = [];
let contattoInModifica = null;

async function apiFetch(path, opts={}, _retry=true){
  const headers = Object.assign({'Content-Type':'application/json'}, opts.headers||{});
  if(AUTH.token) headers['Authorization'] = 'Bearer '+AUTH.token;
  let res;
  try{
    res = await fetch(API_BASE+path, Object.assign({}, opts, {headers}));
  } catch(networkErr){
    // Stesso principio già usato nel calendario: Render può essere "a
    // freddo" dopo inattività, un retry copre la maggior parte dei casi.
    if(_retry){
      await new Promise(r=>setTimeout(r, 4000));
      return apiFetch(path, opts, false);
    }
    throw new Error('Server non raggiungibile (potrebbe essere in fase di risveglio, riprova tra qualche secondo).');
  }
  let body = null;
  try{ body = await res.json(); } catch(e){}
  if(!res.ok){
    const msg = (body && body.error) ? body.error : ('Errore '+res.status);
    throw new Error(msg);
  }
  return body;
}

function toApiPayload(c){
  return {
    cognome: c.cognome,
    nome: c.nome || null,
    pseudonimo: c.pseudonimo || null,
    telefono1: c.telefono1 || null,
    telefono2: c.telefono2 || null,
    email: c.email || null,
    note: c.note || null
  };
}
function fromApiRecord(r){
  return {
    id: r.id,
    cognome: r.cognome || '',
    nome: r.nome || '',
    pseudonimo: r.pseudonimo || '',
    telefono1: r.telefono1 || '',
    telefono2: r.telefono2 || '',
    email: r.email || '',
    note: r.note || ''
  };
}

async function eseguiLogin(){
  const user = document.getElementById('login-user').value.trim();
  const pass = document.getElementById('login-pass').value;
  const btn = document.getElementById('login-btn');
  const err = document.getElementById('login-error');
  err.style.display = 'none';
  if(!user || !pass){ err.textContent = 'Inserisci utente e password.'; err.style.display='block'; return; }
  btn.disabled = true; btn.textContent = 'Accesso in corso…';
  try{
    const r = await apiFetch('/login', { method:'POST', body: JSON.stringify({username:user, password:pass}) });
    if(!r.ok){ throw new Error(r.error || 'Credenziali non valide'); }
    AUTH.token = r.token; AUTH.nominativo = user.toUpperCase(); AUTH.ruolo = r.ruolo;
    document.getElementById('user-label').textContent = 'Ciao, '+AUTH.nominativo;
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('app-root').style.display = '';
    await caricaContatti();
  } catch(e){
    err.textContent = e.message || 'Errore di accesso.';
    err.style.display = 'block';
  } finally {
    btn.disabled = false; btn.textContent = 'Accedi';
  }
}

async function caricaContatti(){
  const rows = await apiFetch('/rubrica');
  contatti = rows.map(fromApiRecord);
  renderContatti();
}

function renderContatti(){
  const body = document.getElementById('rub-body');
  const q = (document.getElementById('rub-search').value||'').trim().toLowerCase();
  let lista = contatti.slice().sort((a,b)=>
    (a.cognome+a.nome).localeCompare(b.cognome+b.nome, 'it')
  );
  if(q){
    lista = lista.filter(c=>
      (c.cognome||'').toLowerCase().includes(q) ||
      (c.nome||'').toLowerCase().includes(q) ||
      (c.pseudonimo||'').toLowerCase().includes(q)
    );
  }
  if(!lista.length){
    body.innerHTML = '<div class="rub-empty"><i>📇</i>'+(q ? 'Nessun contatto trovato.' : 'Nessun contatto in rubrica.<br>Tocca + per aggiungerne uno.')+'</div>';
    return;
  }
  let html = '';
  let letteraCorrente = '';
  lista.forEach(c=>{
    const lettera = (c.cognome||'?').charAt(0).toUpperCase();
    if(lettera !== letteraCorrente){
      letteraCorrente = lettera;
      html += '<div class="rub-letter">'+lettera+'</div>';
    }
    const nomeCompleto = (c.cognome+' '+c.nome).trim();
    html += '<div class="rub-card">';
    html += '<div class="rub-card-top">';
    html += '<div class="rub-avatar">👤</div>';
    html += '<div class="rub-info">';
    html += '<div class="rub-nome">'+nomeCompleto+'</div>';
    if(c.pseudonimo) html += '<div class="rub-pseudo">'+c.pseudonimo+'</div>';
    html += '</div>';
    html += '<button class="rub-edit-btn" onclick="apriModaleModifica('+c.id+')" title="Modifica">✏️</button>';
    html += '</div>';
    if(c.telefono1 || c.telefono2 || c.email){
      html += '<div class="rub-actions">';
      if(c.telefono1) html += '<a class="rub-action call" href="tel:'+c.telefono1.replace(/\s/g,'')+'">📞 '+c.telefono1+'</a>';
      if(c.telefono2) html += '<a class="rub-action call" href="tel:'+c.telefono2.replace(/\s/g,'')+'">📞 '+c.telefono2+'</a>';
      if(c.email) html += '<a class="rub-action mail" href="mailto:'+c.email+'">✉️ '+c.email+'</a>';
      html += '</div>';
    }
    if(c.note) html += '<div class="rub-note">'+c.note+'</div>';
    html += '</div>';
  });
  body.innerHTML = html;
}

function apriModaleNuovo(){
  contattoInModifica = null;
  document.getElementById('modal-title').textContent = 'Nuovo contatto';
  ['f-cognome','f-nome','f-pseudonimo','f-telefono1','f-telefono2','f-email','f-note'].forEach(id=>{
    document.getElementById(id).value = '';
  });
  document.getElementById('btn-elimina-contatto').style.display = 'none';
  document.getElementById('modal-overlay').classList.add('show');
  setTimeout(()=>document.getElementById('f-cognome').focus(), 200);
}

function apriModaleModifica(id){
  const c = contatti.find(x=>x.id===id);
  if(!c) return;
  contattoInModifica = id;
  document.getElementById('modal-title').textContent = 'Modifica contatto';
  document.getElementById('f-cognome').value = c.cognome;
  document.getElementById('f-nome').value = c.nome;
  document.getElementById('f-pseudonimo').value = c.pseudonimo;
  document.getElementById('f-telefono1').value = c.telefono1;
  document.getElementById('f-telefono2').value = c.telefono2;
  document.getElementById('f-email').value = c.email;
  document.getElementById('f-note').value = c.note;
  document.getElementById('btn-elimina-contatto').style.display = 'block';
  document.getElementById('modal-overlay').classList.add('show');
}

function chiudiModale(){
  document.getElementById('modal-overlay').classList.remove('show');
}

async function salvaContatto(){
  const cognome = document.getElementById('f-cognome').value.trim();
  if(!cognome){ alert('Il cognome è obbligatorio.'); return; }
  const dati = {
    cognome: cognome,
    nome: document.getElementById('f-nome').value.trim(),
    pseudonimo: document.getElementById('f-pseudonimo').value.trim(),
    telefono1: document.getElementById('f-telefono1').value.trim(),
    telefono2: document.getElementById('f-telefono2').value.trim(),
    email: document.getElementById('f-email').value.trim(),
    note: document.getElementById('f-note').value.trim()
  };
  const btn = document.getElementById('btn-salva-contatto');
  btn.disabled = true; btn.textContent = 'Salvo…';
  try{
    if(contattoInModifica){
      await apiFetch('/rubrica?id='+contattoInModifica, { method:'PATCH', body: JSON.stringify(toApiPayload(dati)) });
    } else {
      await apiFetch('/rubrica', { method:'POST', body: JSON.stringify(toApiPayload(dati)) });
    }
    chiudiModale();
    await caricaContatti();
  } catch(e){
    alert('Errore nel salvataggio: '+e.message);
  } finally {
    btn.disabled = false; btn.textContent = 'Salva';
  }
}

async function eliminaContatto(){
  if(!contattoInModifica) return;
  if(!confirm('Eliminare questo contatto? L\'operazione non è recuperabile.')) return;
  try{
    await apiFetch('/rubrica?id='+contattoInModifica, { method:'DELETE' });
    chiudiModale();
    await caricaContatti();
  } catch(e){
    alert('Errore nell\'eliminazione: '+e.message);
  }
}

// ── IMPORTAZIONE DA VCARD (.vcf) ────────────────────────────
// Formato universale esportabile da Gmail, Outlook/Hotmail,
// Thunderbird, iCloud e dalla rubrica di qualsiasi telefono —
// niente integrazione diretta con le API di quei servizi (avrebbe
// richiesto chiavi sviluppatore e schermate di autorizzazione,
// un progetto a sé): l'utente esporta un file, lo carica qui.
let contattiDaImportare = [];

function parseVCard(testo){
  const risultati = [];
  const blocchi = testo.split(/BEGIN:VCARD/i).slice(1);
  blocchi.forEach(blocco=>{
    const righe = blocco.split(/\r\n|\r|\n/);
    let cognome='', nome='', telefoni=[], email='', note='';
    righe.forEach(rigaRaw=>{
      const riga = rigaRaw.trim();
      if(!riga) return;
      const idx = riga.indexOf(':');
      if(idx<0) return;
      const chiaveBase = riga.substring(0,idx).split(';')[0].toUpperCase();
      const valore = riga.substring(idx+1).trim();
      if(chiaveBase==='N'){
        const parti = valore.split(';');
        if(parti[0]) cognome = parti[0].trim();
        if(parti[1]) nome = parti[1].trim();
      } else if(chiaveBase==='FN'){
        if(!cognome && !nome){
          const p = valore.trim().split(/\s+/);
          cognome = p.pop()||''; nome = p.join(' ');
        }
      } else if(chiaveBase==='TEL'){
        if(valore) telefoni.push(valore);
      } else if(chiaveBase==='EMAIL'){
        if(!email) email = valore;
      } else if(chiaveBase==='NOTE'){
        note = valore;
      }
    });
    if(cognome || nome){
      risultati.push({
        cognome: cognome || nome, nome: cognome ? nome : '',
        telefono1: telefoni[0]||'', telefono2: telefoni[1]||'',
        email: email, note: note, selezionato: true
      });
    }
  });
  return risultati;
}

function gestisciFileImportato(event){
  const file = event.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(e){
    const parsed = parseVCard(e.target.result);
    if(!parsed.length){
      alert('Nessun contatto valido trovato nel file. Verifica che sia un vero export vCard (.vcf).');
      event.target.value = '';
      return;
    }
    contattiDaImportare = parsed;
    renderAnteprimaImport();
    document.getElementById('modal-import').classList.add('show');
  };
  reader.onerror = function(){ alert('Impossibile leggere il file selezionato.'); };
  reader.readAsText(file);
  event.target.value = ''; // permette di ricaricare lo stesso file una seconda volta
}

function renderAnteprimaImport(){
  document.getElementById('import-info').textContent =
    contattiDaImportare.length+' contatt'+(contattiDaImportare.length===1?'o trovato':'i trovati')+' nel file — deseleziona quelli che non vuoi importare.';
  const lista = document.getElementById('import-list');
  lista.innerHTML = contattiDaImportare.map((c,i)=>{
    const dett = [c.telefono1, c.telefono2, c.email].filter(Boolean).join(' · ');
    return '<div class="import-row">'
      + '<input type="checkbox" '+(c.selezionato?'checked':'')+' onchange="contattiDaImportare['+i+'].selezionato=this.checked">'
      + '<div><div class="import-row-nome">'+(c.cognome+' '+c.nome).trim()+'</div>'
      + (dett ? '<div class="import-row-dett">'+dett+'</div>' : '')
      + '</div></div>';
  }).join('');
}

function chiudiModaleImport(){
  document.getElementById('modal-import').classList.remove('show');
  contattiDaImportare = [];
}

async function confermaImportazione(){
  const selezionati = contattiDaImportare.filter(c=>c.selezionato);
  if(!selezionati.length){ alert('Nessun contatto selezionato.'); return; }
  const btn = document.getElementById('btn-conferma-import');
  btn.disabled = true;
  let riusciti = 0, falliti = 0;
  for(const c of selezionati){
    btn.textContent = 'Importazione '+(riusciti+falliti+1)+'/'+selezionati.length+'...';
    try{
      await apiFetch('/rubrica', { method:'POST', body: JSON.stringify(toApiPayload(c)) });
      riusciti++;
    } catch(e){
      falliti++;
      console.warn('Import fallito per', c.cognome, c.nome, ':', e.message);
    }
  }
  btn.disabled = false; btn.textContent = 'Importa selezionati';
  chiudiModaleImport();
  await caricaContatti();
  alert(riusciti+' contatt'+(riusciti===1?'o importato':'i importati')+(falliti ? ', '+falliti+' non riusciti (vedi console)' : '')+'.');
}

function chiudiRubrica(){
  window.close();
  setTimeout(()=>{
    alert('Chiudi pure questa scheda e torna al wizard DIVA.');
  }, 300);
}

async function avviaApp(){
  const qs = new URLSearchParams(window.location.search);
  const tokenUrl = qs.get('token');
  const nominativoUrl = qs.get('nominativo');
  const ruoloUrl = qs.get('ruolo');

  if(tokenUrl && nominativoUrl){
    AUTH.token = tokenUrl;
    AUTH.nominativo = nominativoUrl.toUpperCase();
    AUTH.ruolo = ruoloUrl || 'utente';
    document.getElementById('user-label').textContent = 'Ciao, '+AUTH.nominativo;
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('app-root').style.display = '';
    try{
      await caricaContatti();
    } catch(e){
      alert('Sessione non valida o scaduta. Torna al wizard DIVA e riapri "La mia rubrica".');
    }
    return;
  }

  // Nessun token in URL: mostra il form di login manuale (solo per test diretti)
  document.getElementById('login-screen').style.display = '';
  document.getElementById('app-root').style.display = 'none';
  document.getElementById('login-user').focus();
}

avviaApp();
</script>
