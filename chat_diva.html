<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chat con l'Admin — DIVA Mobile</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
    background: #0f172a;
    color: #e2e8f0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 0;
  }

  .app {
    width: 100%;
    max-width: 760px;
    min-height: 100vh;
    background: linear-gradient(155deg, rgb(46,16,101) 0%, rgb(76,29,149) 50%, rgb(124,58,237) 100%);
    display: flex;
    flex-direction: column;
  }

  /* ===== HEADER ===== */
  .chat-header { padding: 1.1rem 1rem 0.9rem; flex-shrink: 0; }
  .chat-header-top { display: flex; align-items: center; gap: 10px; margin-bottom: 4px; }
  .chat-back {
    width: 34px; height: 34px; border-radius: 10px;
    background: rgba(255,255,255,0.12); border: none; color: #fff;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; font-size: 16px; flex-shrink: 0;
  }
  .chat-back:active { background: rgba(255,255,255,0.2); }
  .chat-title { font-size: 18px; font-weight: 700; color: #fff; }
  .chat-subtitle { font-size: 12px; color: rgba(255,255,255,0.6); margin-left: 44px; }

  /* ===== CORPO CHAT ===== */
  .chat-body {
    flex: 1;
    background: #f4f1fb;
    border-radius: 22px 22px 0 0;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    padding: 16px 12px 110px;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .msg-day-sep {
    text-align: center; font-size: 11px; color: #9c94b8;
    margin: 12px 0 6px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em;
  }
  .msg-row { display: flex; margin: 3px 0; }
  .msg-row.mine { justify-content: flex-end; }
  .msg-row.theirs { justify-content: flex-start; }
  .bubble {
    max-width: 78%; padding: 9px 13px; border-radius: 16px; font-size: 14px; line-height: 1.4;
    box-shadow: 0 1px 2px rgba(0,0,0,.08); word-wrap: break-word; white-space: pre-wrap;
  }
  .bubble.mine { background: linear-gradient(135deg,#fb923c,#ea580c); color: #fff; border-bottom-right-radius: 4px; }
  .bubble.theirs { background: #fff; color: #2e2a3d; border-bottom-left-radius: 4px; }
  .bubble-time { font-size: 10px; margin-top: 4px; opacity: .65; text-align: right; }
  .bubble.theirs .bubble-time { text-align: left; }

  .chat-empty { text-align: center; color: #9c94b8; font-size: 13px; padding: 50px 24px; line-height: 1.6; }

  /* ===== BARRA DI INVIO ===== */
  .chat-input-bar {
    position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
    width: 100%; max-width: 760px; background: #fff;
    padding: 10px 12px; display: flex; gap: 8px; align-items: flex-end;
    box-shadow: 0 -2px 10px rgba(0,0,0,.08);
  }
  .chat-input-bar textarea {
    flex: 1; resize: none; border: 1.5px solid #e7e4ee; border-radius: 14px;
    padding: 10px 13px; font-size: 14px; font-family: inherit;
    max-height: 100px; min-height: 40px;
  }
  .chat-input-bar textarea:focus { outline: none; border-color: #fb923c; }
  .chat-send-btn {
    width: 42px; height: 42px; border-radius: 50%; border: none; flex-shrink: 0;
    background: linear-gradient(135deg,#fb923c,#ea580c); color: #fff; font-size: 18px;
    display: flex; align-items: center; justify-content: center; cursor: pointer;
  }
  .chat-send-btn:disabled { opacity: .5; cursor: not-allowed; }

  /* ===== LOGIN ===== */
  .login-screen {
    position: fixed; inset: 0; z-index: 500;
    background: linear-gradient(135deg, #4c1d95, #3730a3);
    display: flex; align-items: center; justify-content: center;
    padding: 24px;
  }
  .login-box {
    background: #fff; border-radius: 20px; padding: 32px 26px;
    width: 100%; max-width: 340px; box-shadow: 0 20px 60px rgba(0,0,0,.35);
  }
  .login-title { font-size: 20px; font-weight: 800; color: #2e2a3d; text-align: center; margin-bottom: 4px; }
  .login-sub { font-size: 12.5px; color: #8a8598; text-align: center; margin-bottom: 22px; }
  .login-field { margin-bottom: 12px; }
  .login-field label { display:block; font-size: 11px; font-weight: 700; color: #6b6678; text-transform: uppercase; margin-bottom: 4px; }
  .login-field input {
    width: 100%; padding: 11px 12px; border-radius: 10px;
    border: 1.5px solid #e7e4ee; font-size: 14px; font-family: inherit;
  }
  .login-field input:focus { outline: none; border-color: #fb923c; }
  .login-btn {
    width: 100%; margin-top: 8px; padding: 12px; border-radius: 12px;
    border: none; background: linear-gradient(135deg, #fb923c, #ea580c);
    color: #fff; font-size: 14.5px; font-weight: 700; cursor: pointer;
  }
  .login-btn:disabled { opacity: .6; cursor: not-allowed; }
  .login-error {
    background: #fef2f2; border: 1px solid #fecaca; color: #b91c1c;
    font-size: 12.5px; font-weight: 600; padding: 8px 12px; border-radius: 8px;
    margin-bottom: 12px; display: none;
  }
  .login-hint { font-size: 10.5px; color: #b0abbe; text-align: center; margin-top: 16px; line-height: 1.5; }
</style>
</head>
<body>

<div class="login-screen" id="login-screen">
  <div class="login-box">
    <div class="login-title">💬 Chat con l'Admin</div>
    <div class="login-sub">Accedi con le tue credenziali DIVA</div>
    <div class="login-error" id="login-error"></div>
    <div class="login-field">
      <label>Utente</label>
      <input type="text" id="login-user" autocomplete="username" placeholder="nome utente" onkeydown="if(event.key==='Enter') document.getElementById('login-pass').focus()">
    </div>
    <div class="login-field">
      <label>Password</label>
      <input type="password" id="login-pass" autocomplete="current-password" placeholder="password" onkeydown="if(event.key==='Enter') eseguiLogin()">
    </div>
    <button class="login-btn" id="login-btn" onclick="eseguiLogin()">Accedi</button>
    <div class="login-hint">Stesso login usato per il wizard fatture DIVA.<br>La conversazione è visibile solo a te e all'admin.</div>
  </div>
</div>

<div class="app" id="app-root" style="display:none;">

  <div class="chat-header">
    <div class="chat-header-top">
      <button class="chat-back" aria-label="Torna alla home" onclick="chiudiChat()">←</button>
      <span class="chat-title">💬 Chat con l'Admin</span>
    </div>
    <div class="chat-subtitle" id="user-label"></div>
  </div>

  <div class="chat-body" id="chat-body">
    <div class="chat-empty" id="chat-empty">Nessun messaggio ancora.<br>Scrivi qui sotto per contattare l'admin.</div>
  </div>

  <div class="chat-input-bar">
    <textarea id="chat-testo" placeholder="Scrivi un messaggio…" rows="1" onkeydown="onKeyDownTesto(event)" oninput="autoresizeTesto(this)"></textarea>
    <button class="chat-send-btn" id="chat-send-btn" onclick="inviaMessaggio()">➤</button>
  </div>

</div>

<script>
// ════════════════════════════════════════════════════════════
// CONFIGURAZIONE API — server DIVA (stesso backend delle fatture)
// ════════════════════════════════════════════════════════════
const API_BASE = 'https://enpals-server.onrender.com';

let AUTH = { token: null, nominativo: null, ruolo: null };
let _listaAttuale = [];
let _pollingTimer = null;

async function apiFetch(path, opts={}, _retry=true){
  const headers = Object.assign({'Content-Type':'application/json'}, opts.headers||{});
  if(AUTH.token) headers['Authorization'] = 'Bearer '+AUTH.token;
  let res;
  try{
    res = await fetch(API_BASE+path, Object.assign({}, opts, {headers}));
  } catch(networkErr){
    // Il server Render gratuito "dorme" dopo 15 min di inattività: un solo
    // retry automatico dopo una pausa copre la stragrande maggioranza dei casi.
    if(_retry){
      await new Promise(r=>setTimeout(r, 4000));
      return apiFetch(path, opts, false);
    }
    throw new Error('Server non raggiungibile (potrebbe essere in fase di risveglio, riprova tra qualche secondo).');
  }
  let body = null;
  try{ body = await res.json(); } catch(e){}
  if(!res.ok){
    const msg = (body && body.error) ? body.error : ('Errore '+res.status);
    throw new Error(msg);
  }
  return body;
}

function escapeHtml(s){
  const d = document.createElement('div');
  d.textContent = s || '';
  return d.innerHTML;
}
function formattaOra(ts){
  try{
    const d = new Date(/[Z+]/.test(ts) ? ts : ts+'Z');
    return d.toLocaleTimeString('it-IT', {hour:'2-digit',minute:'2-digit'});
  }catch(e){ return ''; }
}
function formattaGiorno(ts){
  try{
    const d = new Date(/[Z+]/.test(ts) ? ts : ts+'Z');
    const oggi = new Date();
    const ieri = new Date(); ieri.setDate(oggi.getDate()-1);
    const sameDay = (a,b)=> a.toDateString()===b.toDateString();
    if(sameDay(d,oggi)) return 'Oggi';
    if(sameDay(d,ieri)) return 'Ieri';
    return d.toLocaleDateString('it-IT', {day:'2-digit',month:'long',year:'numeric'});
  }catch(e){ return ''; }
}

function renderMessaggi(lista){
  const body = document.getElementById('chat-body');
  if(!lista || !lista.length){
    body.innerHTML = '<div class="chat-empty" id="chat-empty">Nessun messaggio ancora.<br>Scrivi qui sotto per contattare l\'admin.</div>';
    return;
  }
  let html = '';
  let giornoCorrente = '';
  lista.forEach(function(m){
    const giorno = formattaGiorno(m.ts);
    if(giorno !== giornoCorrente){
      html += '<div class="msg-day-sep">'+giorno+'</div>';
      giornoCorrente = giorno;
    }
    const mine = m.autore_ruolo === 'utente';
    html += '<div class="msg-row '+(mine?'mine':'theirs')+'">';
    html += '  <div class="bubble '+(mine?'mine':'theirs')+'">';
    html += '    <div>'+escapeHtml(m.testo)+'</div>';
    html += '    <div class="bubble-time">'+formattaOra(m.ts)+'</div>';
    html += '  </div>';
    html += '</div>';
  });
  body.innerHTML = html;
  body.scrollTop = body.scrollHeight;
}

async function caricaMessaggi(){
  try{
    const lista = await apiFetch('/messaggi?nominativo='+encodeURIComponent(AUTH.nominativo));
    const cambiato = JSON.stringify(lista) !== JSON.stringify(_listaAttuale);
    _listaAttuale = lista;
    if(cambiato){
      renderMessaggi(lista);
      // Ci sono messaggi dell'admin e la pagina è aperta davvero: segnali letti.
      const ciSonoMsgAdmin = lista.some(function(m){ return m.autore_ruolo==='admin'; });
      if(ciSonoMsgAdmin){
        apiFetch('/messaggi/segna_letti', {method:'PATCH', body: JSON.stringify({nominativo:AUTH.nominativo})}).catch(function(){});
      }
    }
  }catch(e){
    console.log('Errore caricamento messaggi:', e.message);
  }
}

function avviaPolling(){
  if(_pollingTimer) clearInterval(_pollingTimer);
  _pollingTimer = setInterval(function(){
    if(document.visibilityState === 'visible') caricaMessaggi();
  }, 8000);
}

function autoresizeTesto(el){
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 100)+'px';
}
function onKeyDownTesto(ev){
  if(ev.key==='Enter' && !ev.shiftKey){
    ev.preventDefault();
    inviaMessaggio();
  }
}

async function inviaMessaggio(){
  const ta = document.getElementById('chat-testo');
  const btn = document.getElementById('chat-send-btn');
  const testo = ta.value.trim();
  if(!testo) return;
  btn.disabled = true;
  try{
    await apiFetch('/messaggi', {method:'POST', body: JSON.stringify({nominativo:AUTH.nominativo, testo:testo})});
    ta.value = '';
    ta.style.height = 'auto';
    await caricaMessaggi();
  }catch(e){
    alert('Errore invio: '+e.message);
  }finally{
    btn.disabled = false;
    ta.focus();
  }
}

/* window.close() funziona solo se la scheda è stata aperta via script
   (come fa il wizard con window.open). Se il tentativo fallisce, mostriamo
   un avviso invece di fallire silenziosamente. */
function chiudiChat(){
  window.close();
  setTimeout(function(){
    alert('Chiudi pure questa scheda e torna al wizard DIVA.');
  }, 300);
}

async function eseguiLogin(){
  const user = document.getElementById('login-user').value.trim();
  const pass = document.getElementById('login-pass').value;
  const btn = document.getElementById('login-btn');
  const err = document.getElementById('login-error');
  err.style.display = 'none';
  if(!user || !pass){ err.textContent = 'Inserisci utente e password.'; err.style.display='block'; return; }
  btn.disabled = true; btn.textContent = 'Accesso in corso…';
  try{
    const r = await apiFetch('/login', { method:'POST', body: JSON.stringify({username:user, password:pass}) });
    if(!r.ok){ throw new Error(r.error || 'Credenziali non valide'); }
    AUTH.token = r.token; AUTH.nominativo = user.toUpperCase(); AUTH.ruolo = r.ruolo;
    await avviaSchermata();
  }catch(e){
    err.textContent = e.message || 'Errore di accesso.';
    err.style.display = 'block';
  }finally{
    btn.disabled = false; btn.textContent = 'Accedi';
  }
}

async function avviaSchermata(){
  document.getElementById('user-label').textContent = 'Ciao, '+AUTH.nominativo;
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('app-root').style.display = '';
  await caricaMessaggi();
  avviaPolling();
  document.getElementById('chat-testo').focus();
}

async function avviaApp(){
  const qs = new URLSearchParams(window.location.search);
  const tokenUrl = qs.get('token');
  const nominativoUrl = qs.get('nominativo');
  const ruoloUrl = qs.get('ruolo');

  if(tokenUrl && nominativoUrl){
    AUTH.token = tokenUrl;
    AUTH.nominativo = nominativoUrl.toUpperCase();
    AUTH.ruolo = ruoloUrl || 'utente';
    try{
      await avviaSchermata();
    }catch(e){
      alert('Sessione non valida o scaduta. Torna al wizard DIVA e riapri la chat.');
    }
    return;
  }

  // Nessun token in URL: mostra il form di login manuale (solo per test diretti)
  document.getElementById('login-screen').style.display = '';
  document.getElementById('app-root').style.display = 'none';
  document.getElementById('login-user').focus();
}

avviaApp();
</script>

</body>
</html>
