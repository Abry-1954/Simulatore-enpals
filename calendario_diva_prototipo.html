<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Il mio calendario — DIVA Mobile</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
    background: #0f172a;
    color: #e2e8f0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 0;
    --app-width: 760px;
  }

  .app {
    width: 100%;
    max-width: 760px;
    min-height: 100vh;
    background: linear-gradient(155deg, rgb(46,16,101) 0%, rgb(76,29,149) 50%, rgb(124,58,237) 100%);
    display: flex;
    flex-direction: column;
  }

  /* ===== AVVISO RUOTA SCHERMO (solo telefono verticale, vista settimana) ===== */
  .rotate-hint {
    display: none;
    flex-direction: column;
    align-items: center;
    text-align: center;
    padding: 3.5rem 1.5rem;
    color: #6b6678;
  }
  .rotate-hint i {
    font-size: 40px;
    color: #fb923c;
    margin-bottom: 14px;
    display: inline-block;
  }
  .rotate-hint-title { font-size: 15px; font-weight: 700; color: #2e2a3d; margin-bottom: 6px; }
  .rotate-hint-sub { font-size: 13px; line-height: 1.5; max-width: 260px; }
  .rotate-hint-btn {
    margin-top: 18px;
    padding: 10px 18px;
    border-radius: 11px;
    border: 1.5px solid #fed7aa;
    background: #fff7ed;
    color: #c2410c;
    font-size: 13.5px;
    font-weight: 700;
    cursor: pointer;
  }
  @media (orientation: portrait) and (max-width: 600px) {
    .week-needs-rotate .rotate-hint { display: flex; }
    .week-needs-rotate .time-view { display: none; }
  }

  /* ===== HEADER ===== */
  .cal-header {
    padding: 1.1rem 1rem 0.9rem;
    flex-shrink: 0;
  }
  .cal-header-top {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 4px;
  }
  .cal-back {
    width: 34px; height: 34px;
    border-radius: 10px;
    background: rgba(255,255,255,0.12);
    border: none;
    color: #fff;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    font-size: 16px;
    flex-shrink: 0;
  }
  .cal-back:active { background: rgba(255,255,255,0.2); }
  .cal-title { font-size: 18px; font-weight: 700; color: #fff; }
  .cal-subtitle { font-size: 12px; color: rgba(255,255,255,0.6); margin-left: 44px; }

  /* ===== NAVIGAZIONE PERIODO ===== */
  .cal-nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0.9rem 1rem 0.7rem;
    flex-shrink: 0;
  }
  .cal-nav-btn {
    width: 30px; height: 30px;
    border-radius: 8px;
    background: rgba(255,255,255,0.1);
    border: none;
    color: #fff;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    font-size: 14px;
  }
  .cal-nav-btn:active { background: rgba(255,255,255,0.18); }
  .cal-nav-label {
    font-size: 15px;
    font-weight: 600;
    color: #fff;
    text-align: center;
    flex: 1;
    text-transform: capitalize;
  }
  .cal-today-btn {
    font-size: 11px;
    color: #fcd34d;
    background: rgba(252,211,77,0.12);
    border: 1px solid rgba(252,211,77,0.3);
    border-radius: 6px;
    padding: 4px 9px;
    cursor: pointer;
    font-weight: 600;
    margin-left: 8px;
  }

  /* ===== TABS VISTA ===== */
  .cal-tabs {
    display: flex;
    gap: 6px;
    padding: 0 1rem 0.9rem;
    flex-shrink: 0;
  }
  .cal-tab {
    flex: 1;
    text-align: center;
    padding: 7px 0;
    border-radius: 9px;
    background: rgba(255,255,255,0.08);
    color: rgba(255,255,255,0.65);
    font-size: 12.5px;
    font-weight: 600;
    cursor: pointer;
    border: 1px solid transparent;
    transition: background 0.15s, color 0.15s;
  }
  .cal-tab.active {
    background: rgba(251,146,60,0.18);
    color: #fdba74;
    border-color: rgba(251,146,60,0.35);
  }

  /* ===== CORPO SCROLLABILE ===== */
  .cal-body {
    flex: 1;
    background: #b9d9bd;
    border-radius: 22px 22px 0 0;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    padding-bottom: 90px;
  }

  /* ===== VISTA MESE ===== */
  .month-grid {
    padding: 1rem 0.85rem 0;
  }
  .month-weekdays {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    margin-bottom: 6px;
  }
  .month-weekdays span {
    text-align: center;
    font-size: 10.5px;
    font-weight: 700;
    color: #9b96a8;
    text-transform: uppercase;
    letter-spacing: 0.03em;
  }
  .month-days {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 3px;
  }
  .month-day {
    aspect-ratio: 1;
    border-radius: 10px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    padding-top: 6px;
    cursor: pointer;
    position: relative;
    background: transparent;
    border: 1px solid transparent;
  }
  .month-day:active { background: #efedf6; }
  .month-day.other-month { opacity: 0.28; }
  .month-day.today { border-color: #fb923c; background: #fff7ed; }
  .month-day-num {
    font-size: 13px;
    font-weight: 600;
    color: #2e2a3d;
  }
  .month-day.today .month-day-num { color: #c2410c; font-weight: 700; }
  .month-day-dots {
    display: flex;
    gap: 2px;
    margin-top: 4px;
    flex-wrap: wrap;
    justify-content: center;
    max-width: 30px;
  }
  .month-dot { width: 5px; height: 5px; border-radius: 50%; }

  /* ===== VISTA SETTIMANA / GIORNO — griglia oraria ===== */
  .time-view { display: flex; }
  .time-col {
    width: 34px;
    flex-shrink: 0;
    padding-top: 14px;
    border-right: 1px solid #8fae93;
  }
  .time-slot-label {
    height: 58px;
    font-size: 11px;
    font-weight: 700;
    color: #5b5668;
    text-align: right;
    padding-right: 5px;
    transform: translateY(-7px);
  }
  .days-scroll {
    flex: 1;
    min-width: 0;
  }
  .days-row {
    display: flex;
    border-bottom: 1px solid #8fae93;
  }
  .day-head {
    flex: 1;
    min-width: 0;
    text-align: center;
    padding: 8px 1px 10px;
    cursor: pointer;
  }
  .day-head:active { background: #f4f2f9; }
  .day-head.single { cursor: default; }
  .day-head.single:active { background: transparent; }
  .day-head-dow { font-size: 10px; color: #9b96a8; font-weight: 700; text-transform: uppercase; letter-spacing: 0.03em; }
  .day-head-num {
    width: 26px; height: 26px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    margin: 3px auto 0;
    font-size: 13px;
    font-weight: 600;
    color: #2e2a3d;
  }
  .day-head.today .day-head-num { background: #fb923c; color: #fff; }
  .day-head.single { min-width: 100%; }

  .grid-wrap { position: relative; }
  .grid-lines { position: relative; }
  .grid-line {
    height: 58px;
    border-bottom: 1px solid #8fae93;
  }
  .grid-cols { display: flex; position: absolute; top: 0; left: 0; right: 0; bottom: 0; }
  .grid-day-col {
    flex: 1;
    min-width: 0;
    position: relative;
    border-right: 1px solid #8fae93;
  }
  .grid-day-col.single { min-width: 100%; }
  .grid-hour-cell {
    height: 58px;
    cursor: pointer;
  }
  .grid-hour-cell:active { background: #f4f2f9; }

  .cal-event {
    position: absolute;
    left: 3px; right: 3px;
    border-radius: 7px;
    padding: 4px 7px;
    overflow: hidden;
    cursor: pointer;
    border-left: 3px solid;
  }
  .cal-event-title { font-size: 12px; font-weight: 700; line-height: 1.3; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .cal-event-azienda { font-size: 10.5px; font-weight: 600; opacity: 0.85; margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cal-event-time { font-size: 10px; opacity: 0.8; margin-top: 1px; font-weight: 600; }

  .now-line {
    position: absolute;
    left: 0; right: 0;
    height: 0;
    border-top: 2px solid #ef4444;
    z-index: 5;
  }
  .now-line::before {
    content: '';
    position: absolute;
    left: -4px; top: -4px;
    width: 8px; height: 8px;
    border-radius: 50%;
    background: #ef4444;
  }

  /* ===== LISTA APPUNTAMENTI DEL GIORNO (sotto al mese) ===== */
  .day-agenda { padding: 1.1rem 1rem 0; }
  .day-agenda-title {
    font-size: 12.5px;
    font-weight: 700;
    color: #6b6678;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    margin-bottom: 10px;
  }
  .agenda-item {
    display: flex;
    gap: 10px;
    background: #fff;
    border-radius: 12px;
    padding: 10px 12px;
    margin-bottom: 8px;
    align-items: center;
    border: 1px solid #ece9f3;
    cursor: pointer;
  }
  .agenda-item:active { background: #faf9fc; }
  .agenda-bar { width: 4px; align-self: stretch; border-radius: 3px; flex-shrink: 0; }
  .agenda-time { font-size: 11.5px; font-weight: 700; color: #6b6678; width: 42px; flex-shrink: 0; line-height: 1.3; }
  .agenda-info { flex: 1; min-width: 0; }
  .agenda-info-title { font-size: 13.5px; font-weight: 600; color: #2e2a3d; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .agenda-info-sub { font-size: 11.5px; color: #9b96a8; margin-top: 1px; }
  .agenda-empty {
    text-align: center;
    padding: 2.2rem 1rem;
    color: #a9a4b8;
    font-size: 13px;
  }
  .agenda-empty i { font-size: 26px; display: block; margin-bottom: 8px; opacity: 0.5; }

  /* ===== RIEPILOGO MENSILE PER AZIENDA ===== */
  .riepilogo-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 1.1rem; }
  .riepilogo-row {
    display: flex;
    align-items: center;
    gap: 10px;
    background: #fff;
    border: 1px solid #ece9f3;
    border-radius: 12px;
    padding: 10px 12px;
  }
  .riepilogo-bar { width: 4px; align-self: stretch; border-radius: 3px; flex-shrink: 0; }
  .riepilogo-nome {
    flex: 1;
    min-width: 0;
    font-size: 13.5px;
    font-weight: 600;
    color: #2e2a3d;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .riepilogo-stat {
    font-size: 12px;
    font-weight: 700;
    color: #6b6678;
    background: #f4f2f9;
    border-radius: 7px;
    padding: 4px 9px;
    flex-shrink: 0;
    white-space: nowrap;
  }
  .riepilogo-totale {
    display: flex;
    gap: 10px;
    padding-bottom: 1.4rem;
  }
  .riepilogo-totale-item {
    flex: 1;
    background: linear-gradient(135deg, #fff7ed, #ffedd5);
    border: 1px solid #fed7aa;
    border-radius: 14px;
    padding: 14px 10px;
    text-align: center;
    display: flex;
    flex-direction: column;
  }
  .riepilogo-totale-num { font-size: 22px; font-weight: 700; color: #c2410c; line-height: 1.2; }
  .riepilogo-totale-lbl { font-size: 11.5px; font-weight: 600; color: #9a5b2e; margin-top: 2px; }

  /* ===== FAB AGGIUNGI ===== */
  .fab {
    position: fixed;
    bottom: 22px;
    right: max(22px, calc((100vw - var(--app-width, 460px)) / 2 + 22px));
    width: 54px; height: 54px;
    border-radius: 50%;
    background: linear-gradient(135deg, #fb923c, #f97316);
    border: none;
    color: #fff;
    font-size: 24px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    box-shadow: 0 6px 18px rgba(251,146,60,0.45);
    z-index: 40;
  }
  .fab:active { transform: scale(0.94); }

  /* ===== MODALE CREAZIONE / DETTAGLIO ===== */
  .modal-overlay {
    position: fixed; inset: 0;
    background: rgba(15,23,42,0.55);
    display: none;
    align-items: flex-end;
    justify-content: center;
    z-index: 100;
  }
  .modal-overlay.show { display: flex; }
  .modal-sheet {
    width: 100%;
    max-width: 460px;
    background: #fff;
    border-radius: 20px 20px 0 0;
    padding: 1.3rem 1.2rem calc(1.3rem + env(safe-area-inset-bottom));
    max-height: 86vh;
    overflow-y: auto;
  }
  .modal-handle {
    width: 36px; height: 4px;
    background: #e2dfe9;
    border-radius: 3px;
    margin: 0 auto 1rem;
  }
  .modal-title { font-size: 17px; font-weight: 700; color: #2e2a3d; margin-bottom: 1.1rem; }
  .field-group { margin-bottom: 1rem; }
  .field-label {
    font-size: 12px;
    font-weight: 700;
    color: #6b6678;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    margin-bottom: 6px;
    display: block;
  }
  .field-input, .field-select {
    width: 100%;
    padding: 11px 13px;
    border-radius: 11px;
    border: 1.5px solid #e7e4ee;
    font-size: 14.5px;
    color: #2e2a3d;
    background: #faf9fc;
    font-family: inherit;
  }
  .field-input:focus, .field-select:focus {
    outline: none;
    border-color: #fb923c;
    background: #fff;
  }
  .field-row { display: flex; gap: 10px; }
  .field-row .field-group { flex: 1; }

  .color-picker { display: flex; gap: 8px; }
  .color-dot {
    width: 30px; height: 30px;
    border-radius: 50%;
    cursor: pointer;
    border: 2.5px solid transparent;
    display: flex; align-items: center; justify-content: center;
    color: #fff;
    font-size: 13px;
  }
  .color-dot.selected { border-color: #2e2a3d; }

  .modal-actions { display: flex; gap: 10px; margin-top: 1.4rem; }
  .btn-secondary, .btn-primary {
    flex: 1;
    padding: 13px;
    border-radius: 12px;
    font-size: 14.5px;
    font-weight: 700;
    border: none;
    cursor: pointer;
  }
  .btn-secondary { background: #f1eff6; color: #6b6678; }
  .btn-secondary:active { background: #e7e4ee; }
  .btn-primary { background: linear-gradient(135deg, #fb923c, #f97316); color: #fff; }
  .btn-primary:active { opacity: 0.85; }
  .btn-delete {
    width: 100%;
    margin-top: 10px;
    padding: 11px;
    border-radius: 12px;
    border: 1.5px solid #fecaca;
    background: #fff;
    color: #dc2626;
    font-size: 13.5px;
    font-weight: 700;
    cursor: pointer;
  }

  ::-webkit-scrollbar { display: none; }
</style>
</head>
<body>

<div class="app">

  <div class="cal-header">
    <div class="cal-header-top">
      <button class="cal-back" aria-label="Torna alla home" onclick="alert('Tornerebbe alla home di DIVA')">←</button>
      <span class="cal-title">Il mio calendario</span>
    </div>
    <div class="cal-subtitle" id="user-label">Ciao, CUGINI</div>
  </div>

  <div class="cal-nav">
    <button class="cal-nav-btn" onclick="navPeriodo(-1)">‹</button>
    <div style="display:flex; align-items:center; justify-content:center; flex:1;">
      <span class="cal-nav-label" id="nav-label"></span>
      <button class="cal-today-btn" onclick="vaiOggi()">Oggi</button>
    </div>
    <button class="cal-nav-btn" onclick="navPeriodo(1)">›</button>
  </div>

  <div class="cal-tabs">
    <div class="cal-tab" data-view="day" onclick="cambiaVista('day')">Giorno</div>
    <div class="cal-tab active" data-view="week" onclick="cambiaVista('week')">Settimana</div>
    <div class="cal-tab" data-view="month" onclick="cambiaVista('month')">Mese</div>
  </div>

  <div class="cal-body" id="cal-body"></div>

  <button class="fab" aria-label="Aggiungi appuntamento" onclick="apriModaleNuovo()">+</button>
</div>

<div class="modal-overlay" id="modal-overlay">
  <div class="modal-sheet">
    <div class="modal-handle"></div>
    <div class="modal-title" id="modal-title">Nuovo appuntamento</div>

    <div class="field-group">
      <label class="field-label">Titolo</label>
      <input type="text" class="field-input" id="f-titolo" placeholder="Es. Doppiaggio episodio 4">
    </div>

    <div class="field-group">
      <label class="field-label">Azienda</label>
      <select class="field-select" id="f-azienda">
        <option value="">Nessuna azienda</option>
        <option value="Lumax Production">Lumax Production</option>
        <option value="BB Dub">BB Dub</option>
        <option value="Sound Farm 999">Sound Farm 999</option>
        <option value="3Cycle">3Cycle</option>
        <option value="DEA5">DEA5</option>
      </select>
    </div>

    <div class="field-group">
      <label class="field-label">Data</label>
      <input type="date" class="field-input" id="f-data">
    </div>

    <div class="field-row">
      <div class="field-group">
        <label class="field-label">Inizio</label>
        <input type="time" class="field-input" id="f-inizio">
      </div>
      <div class="field-group">
        <label class="field-label">Fine</label>
        <input type="time" class="field-input" id="f-fine">
      </div>
    </div>

    <div class="field-group">
      <label class="field-label">Colore</label>
      <div class="color-picker" id="color-picker"></div>
    </div>

    <div class="field-group">
      <label class="field-label">Note</label>
      <input type="text" class="field-input" id="f-note" placeholder="Note facoltative">
    </div>

    <div class="modal-actions">
      <button class="btn-secondary" onclick="chiudiModale()">Annulla</button>
      <button class="btn-primary" onclick="salvaEvento()">Salva</button>
    </div>
    <button class="btn-delete" id="btn-elimina" style="display:none" onclick="eliminaEvento()">Elimina appuntamento</button>
  </div>
</div>

<script>
const COLORI = [
  {id:'arancio', bg:'#fff7ed', bar:'#f97316', text:'#9a3412'},
  {id:'blu',     bg:'#eff6ff', bar:'#3b82f6', text:'#1e40af'},
  {id:'verde',   bg:'#f0fdf4', bar:'#22c55e', text:'#166534'},
  {id:'viola',   bg:'#faf5ff', bar:'#a855f7', text:'#6b21a8'},
  {id:'rosa',    bg:'#fdf2f8', bar:'#ec4899', text:'#9d174d'},
];

function oggiISO(d){
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
const OGGI = new Date();
const OGGI_ISO = oggiISO(OGGI);

let eventi = [
  {id:1, titolo:'Doppiaggio ep. 4', azienda:'Lumax Production', data: OGGI_ISO, inizio:'09:00', fine:'11:00', colore:'arancio', note:''},
  {id:2, titolo:'Prova turno', azienda:'Sound Farm 999', data: OGGI_ISO, inizio:'14:30', fine:'16:00', colore:'blu', note:''},
  {id:3, titolo:'Adattamento testo', azienda:'BB Dub', data: addDays(OGGI_ISO,1), inizio:'10:00', fine:'12:30', colore:'verde', note:''},
  {id:4, titolo:'Sessione registrazione', azienda:'3Cycle', data: addDays(OGGI_ISO,1), inizio:'15:00', fine:'17:00', colore:'viola', note:''},
  {id:5, titolo:'Direzione doppiaggio', azienda:'DEA5', data: addDays(OGGI_ISO,3), inizio:'09:30', fine:'13:00', colore:'rosa', note:''},
  {id:6, titolo:'Turno serale', azienda:'Lumax Production', data: addDays(OGGI_ISO,4), inizio:'18:00', fine:'20:00', colore:'arancio', note:''},
  {id:7, titolo:'Riunione cast', azienda:'Sound Farm 999', data: addDays(OGGI_ISO,7), inizio:'11:00', fine:'12:00', colore:'blu', note:''},
];

function addDays(iso, n){
  const d = new Date(iso+'T00:00:00');
  d.setDate(d.getDate()+n);
  return oggiISO(d);
}

let vistaCorrente = 'week';
let dataCorrente = new Date(OGGI);
let slotSelezionato = null;
let eventoInModifica = null;

const MESI = ['gennaio','febbraio','marzo','aprile','maggio','giugno','luglio','agosto','settembre','ottobre','novembre','dicembre'];
const GIORNI_BREVI = ['lun','mar','mer','gio','ven','sab','dom'];

function colorOf(id){ return COLORI.find(c=>c.id===id) || COLORI[0]; }

function cambiaVista(v){
  vistaCorrente = v;
  document.querySelectorAll('.cal-tab').forEach(t=>t.classList.toggle('active', t.dataset.view===v));
  render();
}

function navPeriodo(dir){
  if(vistaCorrente==='day') dataCorrente.setDate(dataCorrente.getDate()+dir);
  else if(vistaCorrente==='week') dataCorrente.setDate(dataCorrente.getDate()+dir*7);
  else dataCorrente.setMonth(dataCorrente.getMonth()+dir);
  render();
}
function vaiOggi(){ dataCorrente = new Date(OGGI); render(); }

function startOfWeek(d){
  const x = new Date(d);
  const day = (x.getDay()+6)%7;
  x.setDate(x.getDate()-day);
  return x;
}

function render(){
  renderNavLabel();
  const body = document.getElementById('cal-body');
  document.body.classList.toggle('week-needs-rotate', vistaCorrente === 'week');
  if(vistaCorrente==='month') body.innerHTML = renderMese();
  else body.innerHTML = renderTimeView(vistaCorrente);
  posizionaEventi();
}

function renderNavLabel(){
  const lbl = document.getElementById('nav-label');
  if(vistaCorrente==='month'){
    lbl.textContent = MESI[dataCorrente.getMonth()] + ' ' + dataCorrente.getFullYear();
  } else if(vistaCorrente==='week'){
    const s = startOfWeek(dataCorrente);
    const e = new Date(s); e.setDate(e.getDate()+6);
    if(s.getMonth()===e.getMonth()) lbl.textContent = s.getDate()+' – '+e.getDate()+' '+MESI[s.getMonth()];
    else lbl.textContent = s.getDate()+' '+MESI[s.getMonth()].slice(0,3)+' – '+e.getDate()+' '+MESI[e.getMonth()].slice(0,3);
  } else {
    lbl.textContent = dataCorrente.getDate()+' '+MESI[dataCorrente.getMonth()]+' '+dataCorrente.getFullYear();
  }
}

function eventiDelGiorno(iso){
  return eventi.filter(e=>e.data===iso).sort((a,b)=>a.inizio.localeCompare(b.inizio));
}

/* ===== VISTA MESE ===== */
function renderMese(){
  const anno = dataCorrente.getFullYear(), mese = dataCorrente.getMonth();
  const primo = new Date(anno, mese, 1);
  const inizioGriglia = startOfWeek(primo);
  let html = '<div class="month-grid"><div class="month-weekdays">';
  GIORNI_BREVI.forEach(g=> html += '<span>'+g+'</span>');
  html += '</div><div class="month-days">';

  for(let i=0;i<42;i++){
    const d = new Date(inizioGriglia); d.setDate(d.getDate()+i);
    const iso = oggiISO(d);
    const isOther = d.getMonth()!==mese;
    const isToday = iso===OGGI_ISO;
    const evs = eventiDelGiorno(iso).slice(0,3);
    html += '<div class="month-day '+(isOther?'other-month ':'')+(isToday?'today':'')+'" onclick="apriSettimanaDaMese(\''+iso+'\')">';
    html += '<span class="month-day-num">'+d.getDate()+'</span>';
    if(evs.length){
      html += '<div class="month-day-dots">';
      evs.forEach(e=> html += '<span class="month-dot" style="background:'+colorOf(e.colore).bar+'"></span>');
      html += '</div>';
    }
    html += '</div>';
  }
  html += '</div></div>';

  html += renderRiepilogoMese(anno, mese);
  return html;
}

function durataOre(inizio, fine){
  const [hI,mI] = inizio.split(':').map(Number);
  const [hF,mF] = fine.split(':').map(Number);
  return ((hF*60+mF) - (hI*60+mI)) / 60;
}

function renderRiepilogoMese(anno, mese){
  const evsMese = eventi.filter(e=>{
    const d = new Date(e.data+'T00:00:00');
    return d.getFullYear()===anno && d.getMonth()===mese;
  });

  let html = '<div class="day-agenda"><div class="day-agenda-title">Riepilogo '+MESI[mese]+' '+anno+'</div>';

  if(!evsMese.length){
    html += '<div class="agenda-empty"><i>—</i>Nessun appuntamento in questo mese.</div></div>';
    return html;
  }

  const perAzienda = {};
  const giorniImpegnati = new Set();
  let oreTotali = 0;

  evsMese.forEach(e=>{
    const nome = e.azienda || 'Senza azienda';
    if(!perAzienda[nome]) perAzienda[nome] = {turni:0, ore:0, colore:e.colore};
    const ore = durataOre(e.inizio, e.fine);
    perAzienda[nome].turni += 1;
    perAzienda[nome].ore += ore;
    oreTotali += ore;
    giorniImpegnati.add(e.data);
  });

  const aziendeOrdinate = Object.keys(perAzienda).sort((a,b)=> perAzienda[b].ore - perAzienda[a].ore);

  html += '<div class="riepilogo-list">';
  aziendeOrdinate.forEach(nome=>{
    const v = perAzienda[nome];
    const c = colorOf(v.colore);
    html += '<div class="riepilogo-row">';
    html += '<div class="riepilogo-bar" style="background:'+c.bar+'"></div>';
    html += '<div class="riepilogo-nome">'+nome+'</div>';
    html += '<div class="riepilogo-stat">'+v.turni+' '+(v.turni===1?'turno':'turni')+'</div>';
    html += '<div class="riepilogo-stat">'+formattaOre(v.ore)+'</div>';
    html += '</div>';
  });
  html += '</div>';

  html += '<div class="riepilogo-totale">';
  html += '<div class="riepilogo-totale-item"><span class="riepilogo-totale-num">'+giorniImpegnati.size+'</span><span class="riepilogo-totale-lbl">'+(giorniImpegnati.size===1?'giorno':'giorni')+' impegnati</span></div>';
  html += '<div class="riepilogo-totale-item"><span class="riepilogo-totale-num">'+formattaOre(oreTotali)+'</span><span class="riepilogo-totale-lbl">ore totali</span></div>';
  html += '</div>';

  html += '</div>';
  return html;
}

function formattaOre(ore){
  const h = Math.floor(ore);
  const m = Math.round((ore - h) * 60);
  if(m === 0) return h + 'h';
  return h + 'h ' + m + 'm';
}

function apriSettimanaDaMese(iso){
  dataCorrente = new Date(iso+'T00:00:00');
  vistaCorrente = 'week';
  document.querySelectorAll('.cal-tab').forEach(t=>t.classList.toggle('active', t.dataset.view==='week'));
  render();
}

function apriGiornoDaMese(iso){
  dataCorrente = new Date(iso+'T00:00:00');
  vistaCorrente = 'day';
  document.querySelectorAll('.cal-tab').forEach(t=>t.classList.toggle('active', t.dataset.view==='day'));
  render();
}

/* ===== VISTA GIORNO / SETTIMANA — griglia oraria ===== */
const ORA_INIZIO = 8, ORA_FINE = 21;

function renderTimeView(modo){
  const giorni = [];
  if(modo==='day') giorni.push(new Date(dataCorrente));
  else { const s = startOfWeek(dataCorrente); for(let i=0;i<7;i++){ const d=new Date(s); d.setDate(d.getDate()+i); giorni.push(d); } }

  let html = '<div class="rotate-hint"><i>&#8635;</i>';
  html += '<div class="rotate-hint-title">Ruota il telefono</div>';
  html += '<div class="rotate-hint-sub">In orizzontale vedi tutti i sette giorni della settimana con il testo ben leggibile.</div>';
  html += '<button class="rotate-hint-btn" onclick="cambiaVista(\'day\')">Vai alla vista Giorno</button></div>';

  html += '<div class="time-view"><div class="time-col">';
  for(let h=ORA_INIZIO; h<ORA_FINE; h++) html += '<div class="time-slot-label">'+String(h).padStart(2,'0')+':00</div>';
  html += '</div><div class="days-scroll"><div class="days-row">';
  giorni.forEach(d=>{
    const iso = oggiISO(d);
    const clickAttr = modo==='week' ? ' onclick="apriGiornoDaMese(\''+iso+'\')"' : '';
    html += '<div class="day-head '+(iso===OGGI_ISO?'today':'')+' '+(modo==='day'?'single':'')+'"'+clickAttr+'>';
    html += '<div class="day-head-dow">'+GIORNI_BREVI[(d.getDay()+6)%7]+'</div>';
    html += '<div class="day-head-num">'+d.getDate()+'</div></div>';
  });
  html += '</div>';

  html += '<div class="grid-wrap"><div class="grid-lines">';
  for(let h=ORA_INIZIO; h<ORA_FINE; h++) html += '<div class="grid-line"></div>';
  html += '</div><div class="grid-cols">';
  giorni.forEach(d=>{
    const iso = oggiISO(d);
    html += '<div class="grid-day-col '+(modo==='day'?'single':'')+'" data-date="'+iso+'">';
    for(let h=ORA_INIZIO; h<ORA_FINE; h++){
      html += '<div class="grid-hour-cell" onclick="apriModaleSuSlot(\''+iso+'\','+h+')"></div>';
    }
    html += '</div>';
  });
  html += '</div></div></div></div>';
  return html;
}

function posizionaEventi(){
  document.querySelectorAll('.grid-day-col').forEach(col=>{
    const iso = col.dataset.date;
    const evs = eventiDelGiorno(iso);
    evs.forEach(e=>{
      const [hI,mI] = e.inizio.split(':').map(Number);
      const [hF,mF] = e.fine.split(':').map(Number);
      const top = ((hI - ORA_INIZIO) * 58) + (mI/60*58);
      const height = Math.max(((hF*60+mF) - (hI*60+mI)) / 60 * 58, 26);
      const c = colorOf(e.colore);
      const div = document.createElement('div');
      div.className = 'cal-event';
      div.style.top = top+'px';
      div.style.height = height+'px';
      div.style.background = c.bg;
      div.style.borderColor = c.bar;
      div.style.color = c.text;
      let contenuto = '<div class="cal-event-title">'+e.titolo+'</div>';
      if(height>40 && e.azienda) contenuto += '<div class="cal-event-azienda" style="color:'+c.text+'">'+e.azienda+'</div>';
      if(height>56) contenuto += '<div class="cal-event-time" style="color:'+c.text+'">'+e.inizio+'–'+e.fine+'</div>';
      div.innerHTML = contenuto;
      div.onclick = function(ev){ ev.stopPropagation(); apriDettaglio(e.id); };
      col.appendChild(div);
    });
    if(iso===OGGI_ISO){
      const now = new Date();
      const h = now.getHours(), m = now.getMinutes();
      if(h>=ORA_INIZIO && h<ORA_FINE){
        const top = ((h-ORA_INIZIO)*58)+(m/60*58);
        const line = document.createElement('div');
        line.className = 'now-line';
        line.style.top = top+'px';
        col.appendChild(line);
      }
    }
  });
}

/* ===== MODALE ===== */
function buildColorPicker(selezionato){
  const wrap = document.getElementById('color-picker');
  wrap.innerHTML = '';
  COLORI.forEach(c=>{
    const dot = document.createElement('div');
    dot.className = 'color-dot'+(c.id===selezionato?' selected':'');
    dot.style.background = c.bar;
    dot.dataset.color = c.id;
    dot.onclick = function(){
      document.querySelectorAll('.color-dot').forEach(x=>x.classList.remove('selected'));
      dot.classList.add('selected');
    };
    wrap.appendChild(dot);
  });
}

function apriModaleNuovo(){
  eventoInModifica = null;
  document.getElementById('modal-title').textContent = 'Nuovo appuntamento';
  document.getElementById('f-titolo').value = '';
  document.getElementById('f-azienda').value = '';
  document.getElementById('f-data').value = oggiISO(dataCorrente);
  document.getElementById('f-inizio').value = '09:00';
  document.getElementById('f-fine').value = '10:00';
  document.getElementById('f-note').value = '';
  document.getElementById('btn-elimina').style.display = 'none';
  buildColorPicker('arancio');
  document.getElementById('modal-overlay').classList.add('show');
}

function apriModaleSuSlot(iso, ora){
  eventoInModifica = null;
  document.getElementById('modal-title').textContent = 'Nuovo appuntamento';
  document.getElementById('f-titolo').value = '';
  document.getElementById('f-azienda').value = '';
  document.getElementById('f-data').value = iso;
  document.getElementById('f-inizio').value = String(ora).padStart(2,'0')+':00';
  document.getElementById('f-fine').value = String(ora+1).padStart(2,'0')+':00';
  document.getElementById('f-note').value = '';
  document.getElementById('btn-elimina').style.display = 'none';
  buildColorPicker('arancio');
  document.getElementById('modal-overlay').classList.add('show');
}

function apriDettaglio(id){
  const e = eventi.find(x=>x.id===id);
  if(!e) return;
  eventoInModifica = id;
  document.getElementById('modal-title').textContent = 'Modifica appuntamento';
  document.getElementById('f-titolo').value = e.titolo;
  document.getElementById('f-azienda').value = e.azienda;
  document.getElementById('f-data').value = e.data;
  document.getElementById('f-inizio').value = e.inizio;
  document.getElementById('f-fine').value = e.fine;
  document.getElementById('f-note').value = e.note;
  document.getElementById('btn-elimina').style.display = 'block';
  buildColorPicker(e.colore);
  document.getElementById('modal-overlay').classList.add('show');
}

function chiudiModale(){
  document.getElementById('modal-overlay').classList.remove('show');
}

function salvaEvento(){
  const titolo = document.getElementById('f-titolo').value.trim();
  if(!titolo){ alert("Inserisci un titolo per l'appuntamento."); return; }
  const colSel = document.querySelector('.color-dot.selected');
  const dati = {
    titolo: titolo,
    azienda: document.getElementById('f-azienda').value,
    data: document.getElementById('f-data').value,
    inizio: document.getElementById('f-inizio').value,
    fine: document.getElementById('f-fine').value,
    colore: colSel ? colSel.dataset.color : 'arancio',
    note: document.getElementById('f-note').value.trim()
  };
  if(dati.fine <= dati.inizio){ alert("L'orario di fine deve essere dopo l'inizio."); return; }

  if(eventoInModifica){
    const e = eventi.find(x=>x.id===eventoInModifica);
    Object.assign(e, dati);
  } else {
    dati.id = Math.max(0,...eventi.map(e=>e.id))+1;
    eventi.push(dati);
  }
  chiudiModale();
  render();
}

function eliminaEvento(){
  if(!eventoInModifica) return;
  eventi = eventi.filter(e=>e.id!==eventoInModifica);
  chiudiModale();
  render();
}

render();
</script>
