<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Test Vocale Numeri</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', sans-serif;
    background: #1a1a2e;
    color: #eee;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  h1 { font-size: 1.4rem; margin-bottom: 6px; color: #a78bfa; letter-spacing: 1px; }
  p.sub { font-size: 0.85rem; color: #888; margin-bottom: 30px; }

  #btnAscolta {
    width: 140px; height: 140px; border-radius: 50%;
    background: #7c3aed;
    border: none; cursor: pointer;
    font-size: 3rem;
    transition: background 0.3s, box-shadow 0.3s;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 0 0 0 rgba(124,58,237,0.5);
  }
  #btnAscolta:disabled { cursor: not-allowed; opacity: 0.8; }

  #btnAscolta.viola  { background: #7c3aed; box-shadow: 0 0 0 0 rgba(124,58,237,0.4); }
  #btnAscolta.giallo { background: #d97706; animation: pulseGiallo 0.6s infinite; }
  #btnAscolta.verde  { background: #16a34a; animation: pulseVerde 1s infinite; }
  #btnAscolta.rosso  { background: #dc2626; animation: pulseRosso 0.8s infinite; }

  @keyframes pulseGiallo {
    0%,100% { box-shadow: 0 0 0 0 rgba(217,119,6,0.6); }
    50%      { box-shadow: 0 0 0 18px rgba(217,119,6,0); }
  }
  @keyframes pulseVerde {
    0%,100% { box-shadow: 0 0 0 0 rgba(22,163,74,0.6); }
    50%      { box-shadow: 0 0 0 22px rgba(22,163,74,0); }
  }
  @keyframes pulseRosso {
    0%,100% { box-shadow: 0 0 0 0 rgba(220,38,38,0.6); }
    50%      { box-shadow: 0 0 0 18px rgba(220,38,38,0); }
  }

  #legenda {
    display: flex; gap: 16px; margin-bottom: 24px; flex-wrap: wrap; justify-content: center;
  }
  .leg { display: flex; align-items: center; gap: 6px; font-size: 0.78rem; color: #94a3b8; }
  .dot { width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0; }
  .dot.v  { background: #7c3aed; }
  .dot.g  { background: #d97706; }
  .dot.gr { background: #16a34a; }
  .dot.r  { background: #dc2626; }

  #stato {
    margin-top: 20px;
    font-size: 1rem;
    color: #94a3b8;
    min-height: 24px;
    text-align: center;
  }
  #risultato {
    margin-top: 16px;
    font-size: 3rem;
    font-weight: bold;
    color: #34d399;
    min-height: 60px;
    text-align: center;
  }

  #storico {
    margin-top: 30px;
    width: 100%;
    max-width: 400px;
    background: #0f172a;
    border-radius: 12px;
    padding: 16px;
  }
  #storico h2 { font-size: 0.85rem; color: #64748b; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 1px; }
  #lista { list-style: none; }
  #lista li {
    display: flex; justify-content: space-between;
    padding: 6px 0;
    border-bottom: 1px solid #1e293b;
    font-size: 0.95rem;
  }
  #lista li:last-child { border-bottom: none; }
  .num { color: #a78bfa; font-weight: bold; }
  .trascritto { color: #34d399; }
  .niente { color: #ef4444; }

  #btnReset {
    margin-top: 16px;
    background: none;
    border: 1px solid #334155;
    color: #64748b;
    padding: 6px 16px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 0.8rem;
  }
  #btnReset:hover { border-color: #64748b; color: #94a3b8; }
</style>
</head>
<body>

<h1>🎤 TEST VOCALE NUMERI</h1>

<div id="legenda">
  <div class="leg"><div class="dot v"></div> Premi per avviare</div>
  <div class="leg"><div class="dot g"></div> Attivazione mic...</div>
  <div class="leg"><div class="dot gr"></div> Parla ora!</div>
  <div class="leg"><div class="dot r"></div> Timeout / errore</div>
</div>

<button id="btnAscolta" class="viola" onclick="avviaAscolto()">🎤</button>

<div id="stato">Premi il microfono e parla</div>
<div id="risultato"></div>

<div id="storico">
  <h2>Storico tentativi</h2>
  <ul id="lista"></ul>
  <button id="btnReset" onclick="resetStorico()">Cancella storico</button>
</div>

<script>
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  let tentativo = 1;
  let inAscolto = false;

  function setBtn(stato) {
    const btn = document.getElementById('btnAscolta');
    btn.className = stato;
    if (stato === 'viola')  { btn.textContent = '🎤'; btn.disabled = false; }
    if (stato === 'giallo') { btn.textContent = '⏳'; btn.disabled = true; }
    if (stato === 'verde')  { btn.textContent = '🟢'; btn.disabled = true; }
    if (stato === 'rosso')  { btn.textContent = '🔴'; btn.disabled = true; }
  }

  function avviaAscolto() {
    if (inAscolto) return;
    if (!SpeechRecognition) {
      document.getElementById('stato').textContent = '❌ Browser non supportato — usa Chrome';
      return;
    }

    const stato = document.getElementById('stato');
    const risultato = document.getElementById('risultato');
    inAscolto = true;
    risultato.textContent = '';

    // FASE 1: GIALLO — attivazione
    setBtn('giallo');
    stato.textContent = '⏳ Attivazione microfono...';

    setTimeout(() => {
      // FASE 2: VERDE — ascolta
      setBtn('verde');
      stato.textContent = '🟢 Parla ora!';

      const rec = new SpeechRecognition();
      rec.lang = 'it-IT';
      rec.interimResults = false;
      rec.maxAlternatives = 3;

      rec.onresult = (e) => {
        const trascritto = e.results[0][0].transcript.trim();
        const confidenza = Math.round(e.results[0][0].confidence * 100);
        risultato.textContent = '"' + trascritto + '"';
        stato.textContent = '✅ Sentito! Confidenza: ' + confidenza + '%';
        aggiungiStorico(trascritto, confidenza);
        fine('viola');
      };

      rec.onerror = (e) => {
        stato.textContent = '❌ Errore: ' + e.error;
        risultato.textContent = '(nessun risultato)';
        aggiungiStoricoVuoto();
        fine('rosso');
      };

      rec.onend = () => {
        if (inAscolto) {
          if (stato.textContent.includes('Parla')) {
            stato.textContent = '🔴 Timeout — nessun suono rilevato';
            risultato.textContent = '(silenzio)';
            aggiungiStoricoVuoto();
            fine('rosso');
          }
        }
      };

      rec.start();

    }, 1000); // 1 secondo di attesa giallo
  }

  function fine(colore) {
    inAscolto = false;
    setTimeout(() => setBtn('viola'), colore === 'rosso' ? 1500 : 500);
  }

  function aggiungiStorico(testo, conf) {
    const lista = document.getElementById('lista');
    const li = document.createElement('li');
    li.innerHTML = `<span class="num">#${tentativo++}</span> <span class="trascritto">"${testo}"</span> <span style="color:#64748b;font-size:0.8rem">${conf}%</span>`;
    lista.prepend(li);
  }

  function aggiungiStoricoVuoto() {
    const lista = document.getElementById('lista');
    const li = document.createElement('li');
    li.innerHTML = `<span class="num">#${tentativo++}</span> <span class="niente">— nessun risultato —</span>`;
    lista.prepend(li);
  }

  function resetStorico() {
    document.getElementById('lista').innerHTML = '';
    tentativo = 1;
  }
</script>
</body>
</html>
